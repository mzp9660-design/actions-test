
name: Daily Backup Test

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update backup file
        run: |
          date -u +"Last run: %Y-%m-%d %H:%M:%S UTC" > backup.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backup.txt
          git diff --cached --quiet || git commit -m "Update backup"
          git push
