        - name: Run Python
          run: |
            import csv

            with open("data.csv", newline="") as f:
                rows = list(csv.DictReader(f))

            scores = [int(row["score"]) for row in rows]

            average = sum(scores) / len(scores)
            highest = max(scores)
            lowest = min(scores)

            report = f"""数据统计报告

            科目数量：{len(scores)}
            平均分：{average:.2f}
            最高分：{highest}
            最低分：{lowest}
            """

            with open("report.txt", "w") as f:
                f.write(report)

            print(report)
          shell: python
